# The dbt project's name and which connection (profile) it uses
name: ecommerce_data_platform
version: "1.0.0"
profile: ecommerce

# Where dbt looks for each kind of file
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

# Compiled SQL and logs go here (git-ignored); `dbt clean` deletes them
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Default settings per folder (layer)
models:
  ecommerce_data_platform:
    staging:
      +schema: staging        # build into the BigQuery dataset "staging"
      +materialized: view     # staging = views by default (cheap, always fresh)
    intermediate:
      +schema: intermediate   # helper models with business logic
      +materialized: view     # default = view; heavy models switch to table in their own config
    marts:
      +schema: marts          # final star schema + summary mart
      +materialized: table    # read often by dashboards → store the result

# Seeds = small CSV lookup files loaded with `dbt seed`
seeds:
  ecommerce_data_platform:
    +schema: staging          # lookup tables live next to the staging models
    channel_mapping:
      +column_types:          # set types ourselves instead of letting dbt guess
        medium: string
        channel_id: string
        channel_name: string
        is_paid: boolean

# Project variables: change the range here, not in the SQL
vars:
  ga4_start_date: "20201101"
  ga4_end_date: "20210131"
  # Days where GA4 order data is reliable (IDs missing before, collapsing after) – used by tests
  reliable_start_date: "2020-11-11"
  reliable_end_date: "2021-01-25"
