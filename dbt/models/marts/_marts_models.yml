version: 2

models:
  - name: fct_events
    description: >
      Fact table, one row per GA4 event, with the channel of the event's
      session. Incremental (insert_overwrite by event_date): each run
      re-processes the last 3 days and overwrites those partitions.
      Run with --full-refresh after changing its logic or the channel mapping.
    columns:
      - name: event_id
        description: Surrogate key from staging (the grain).
        data_tests:
          - unique        # proves incremental runs never duplicate events
          - not_null
      - name: event_date
        description: Day of the event (partition column).
        data_tests:
          - not_null
      - name: event_name
        description: GA4 event type (page_view, purchase, ...).
        data_tests:
          - not_null
      - name: user_pseudo_id
        description: GA4 anonymous user ID.
        data_tests:
          - not_null
      - name: session_key
        description: Session the event belongs to (joins to int_sessions).
      - name: channel_id
        description: Channel of the event's session (joins to dim_channels), or 'unknown'.
        data_tests:
          - not_null
          - relationships:              # every channel must exist in dim_channels
              arguments:
                to: ref('dim_channels')
                field: channel_id
      - name: transaction_id
        description: Order ID on purchase events, otherwise NULL.
      - name: purchase_revenue_usd
        description: Revenue in USD on purchase events.

  - name: fct_orders
    description: >
      Fact table, one row per order. Only purchases with a real GA4
      transaction_id; duplicates removed (first event kept). Purchases
      without an order ID (mainly 1–10 Nov 2020) are excluded, so revenue
      for those days is understated. Channel = channel of the order's session.
    columns:
      - name: transaction_id
        description: GA4 order ID (the grain).
        data_tests:
          - unique
          - not_null
      - name: order_date
        description: Day of the order.
        data_tests:
          - not_null
      - name: user_pseudo_id
        description: User who ordered (joins to dim_customers).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: user_pseudo_id
      - name: channel_id
        description: Channel of the order's session (joins to dim_channels).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_id
      - name: revenue_usd
        description: Order revenue in USD.

  - name: dim_channels
    description: >
      Dimension, one row per marketing channel, from the channel_mapping
      seed plus an 'unknown' member for traffic without a channel.
    columns:
      - name: channel_id
        description: Channel code (primary key).
        data_tests:
          - unique        # also catches a seed with two names for one channel
          - not_null
      - name: channel_name
        description: Readable channel name.
        data_tests:
          - not_null
      - name: is_paid
        description: True if we spend money on this channel.

  - name: dim_customers
    description: >
      Dimension, one row per GA4 user (user_pseudo_id = browser/device, not a
      person). Holds first-touch attribution (channel of the user's first-ever
      visit) and activity totals.
    columns:
      - name: user_pseudo_id
        description: GA4 anonymous user ID (primary key).
        data_tests:
          - unique
          - not_null
      - name: first_touch_channel_id
        description: Channel of the user's first-ever visit (joins to dim_channels).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_id
      - name: is_customer
        description: True if the user placed at least one order.

  - name: mart_channel_performance
    description: >
      Summary mart for the dashboard: one row per channel per day with
      sessions, orders, revenue, spend (USD) and the ratios conversion_rate
      (orders / sessions), roas (revenue / spend) and cost_per_order
      (spend / orders). Built on a full date × channel grid; each source is
      aggregated to channel × day before joining (no fan-out).
      Ratios must be recomputed from the sums for longer periods, never averaged.
      Known limitations: spend is simulated; revenue is only reliable from
      2020-11-11 to ~2021-01-25 (GA4 order IDs missing before, collapsing after);
      Paid Social and Display have spend but no tracked sessions; Referral is
      inflated by self-referrals from the shop's own domain.
    columns:
      - name: channel_day_key
        description: report_date + channel_id (the grain).
        data_tests:
          - unique
          - not_null
      - name: report_date
        description: Day.
        data_tests:
          - not_null
      - name: channel_id
        description: Channel (joins to dim_channels).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_id
      - name: sessions
        description: Sessions attributed to the channel (session-level rule).
        data_tests:
          - not_null
      - name: orders
        description: Orders from sessions of this channel.
        data_tests:
          - not_null
      - name: revenue_usd
        description: Revenue of those orders in USD.
        data_tests:
          - not_null
      - name: spend_usd
        description: Marketing spend in USD (simulated, converted from EUR).
        data_tests:
          - not_null
      - name: conversion_rate
        description: orders / sessions (NULL when sessions = 0).
      - name: roas
        description: revenue_usd / spend_usd (NULL when spend = 0, i.e. unpaid channels).
      - name: cost_per_order
        description: spend_usd / orders (NULL when orders = 0).